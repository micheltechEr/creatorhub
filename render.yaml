# =============================================================================
# Render Blueprint — CreatorHub API + PostgreSQL
# Deploy: Conecte o repo no Render Dashboard → "New" → "Blueprint"
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────
  - type: pserv
    name: creatorhub-db
    plan: starter       # free tier não tem persistência, use starter+
    databaseName: artistflow
    ipAllowList: []      # Apenas serviços internos do Render

  # ── API Server (Docker) ──────────────────────────────────────────────────
  - type: web
    name: creatorhub-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: sao-paulo
    branch: main

    # O Render injeta DATABASE_URL automaticamente ao linkar o serviço de DB
    # via serviceLink (abaixo). As demais variáveis devem ser configuradas
    # manualmente no Dashboard do Render (Environment → Secret Files).
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: creatorhub-db
          property: connectionString
      # Secrets — configurar no Dashboard como "Secret"
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_SECRET
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_ENV
        value: sandbox
      - key: CORS_ORIGIN
        sync: false
      # Vite — disponíveis em tempo de build (substituídas pelo Vite no frontend)
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false

    healthCheckPath: /api/healthz
    autoDeploy: true