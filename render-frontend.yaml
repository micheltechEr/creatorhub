# =============================================================================
# Render Blueprint — CreatorHub Frontend (Static Site)
# Deploy separado: crie um "Static Site" no Render Dashboard vinculado a este yaml
# ou use "New" → "Blueprint" com este arquivo.
# Docs: https://render.com/docs/static-sites
# =============================================================================

staticSites:
  - type: static_site
    name: creatorhub-frontend
    plan: starter
    region: sao-paulo
    branch: main

    buildCommand: |
      corepack enable &&
      corepack prepare pnpm@9.15.4 --activate &&
      pnpm install &&
      pnpm --filter @workspace/api-spec run codegen &&
      pnpm --filter @workspace/artist-platform run build

    staticPublishPath: artifacts/artist-platform/dist/public

    # Variáveis de ambiente do frontend (Vite)
    # VITE_API_BASE_URL: URL da API no Render
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: PORT
        value: "8080"

    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    routes:
      # SPA fallback — todas as rotas retornam index.html
      - type: rewrite
        source: /*
        destination: /index.html